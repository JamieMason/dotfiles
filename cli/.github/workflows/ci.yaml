name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck fzf
      - name: Lint shellcheck
        run: shellcheck -x -e SC1090,SC1091 bin/* lib/*.sh
      - name: Bats test
        run: bats test
