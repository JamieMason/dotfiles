name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "cli/**"
      - ".github/workflows/ci.yaml"
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - ".github/workflows/ci.yaml"

jobs:
  lint-and-test:
    name: Lint and test (cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck fzf
      - name: Lint shellcheck
        run: shellcheck -x -e SC1090,SC1091 cli/bin/* cli/lib/*.sh
      - name: Bats test
        run: bats cli/test
